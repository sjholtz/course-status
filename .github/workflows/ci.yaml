name: CourseStatus CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  lint-and-typecheck:
    name: Lint and Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Static Analysis Tools
        run: |
          python -m pip install --upgrade pip
          pip install black mypy types-python-dateutil

      - name: Enforce Code Formatting (Black)
        # The --check flag fails the build if the code does not meet Black's standards
        run: black --check .

      - name: Static Type Check (Mypy)
        run: mypy courseStatus.py

  test:
    name: Run Pytest Suite
    needs: lint-and-typecheck
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Test across the three major operating systems
        os: [ubuntu-latest, macos-latest, windows-latest]
        # Test across older and newer supported Python versions
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install Test Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest python-dateutil

      - name: Run Tests
        run: |
          pytest tests/
